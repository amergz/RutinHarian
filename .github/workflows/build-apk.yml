name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RH_KEYSTORE_PASSWORD: ${{ secrets.RH_KEYSTORE_PASSWORD || 'rutinharian' }}
      RH_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK sudah dipasang dalam runner ubuntu-latest.
      # Langkah ini hanya tetapkan laluan dan terima lesen.
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "Android SDK: $ANDROID_SDK_ROOT"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > [host-path] || true
          fi

      - name: Create signing keystore (first run only)
        run: |
          git pull --rebase || true
          if [ ! -f keystore/release.p12 ]; then
            mkdir -p keystore
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore keystore/release.p12 -alias rutinharian \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$RH_KEYSTORE_PASSWORD" -keypass "$RH_KEYSTORE_PASSWORD" \
              -dname "CN=Rutin Harian, O=Personal, C=MY"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/release.p12
            git commit -m "chore: add APK signing keystore [skip ci]"
            git push
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply native code, icons and config
        run: node scripts/patch-android.mjs

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android[application]/build/outputs/apk/release[application]-release.apk \
             "dist/RutinHarian-v$(node -p "require('./package.json').version")-${{ github.run_number }}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutinHarian-APK
          path: dist/*.apk
          retention-days: 30
